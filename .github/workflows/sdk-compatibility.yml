name: SDK compatibility
on:
  push:
    branches: ['rabdi/sdk-101-20261103']
  pull_request:
permissions:
  contents: read
concurrency:
  group: sdk-compatibility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sdk101:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run guard:sdk && npm run guard:vocabulary
      - run: node scripts/check-sdk101.mjs
        env:
          TMPDIR: ${{ runner.temp }}
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: sample
      - run: node scripts/vocabulary-build-mutation.mjs
